<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In | EV ChargeFinders</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
  
    :root {
      --bg-dark: #1e1e1e;
      --bg-main: #2a3636;
      --bg-card: #354444;
      --teal: #2fbfae;         
      --text-light: #f1f5f4;
      --text-muted: #b5c4c1;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-light);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .site-header {
      background-color: var(--bg-dark);
      border-bottom: 6px solid var(--teal);
    }
    .logo {
      color: var(--teal);
      font-weight: 700;
      font-size: 2rem;
      margin: 0;
    }
    .tagline {
      font-family: Georgia, serif;
      color: var(--teal);
      margin: 0;
    }

    .login-card {
      background-color: var(--bg-card);
      border: 2px solid var(--bg-dark);
      border-radius: 1rem;
      max-width: 420px;
      width: 100%;
    }
    .form-label { color: var(--text-light); }
    .form-control {
      height: 44px;
      font-size: 1rem;
    }
    .form-control:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 0.2rem rgba(47, 191, 174, 0.3);
    }

    .btn-teal {
      background-color: var(--teal);
      border-color: var(--teal);
      color: #11201e;
      font-weight: 600;
      height: 44px;
    }
    .btn-teal:hover, .btn-teal:focus {
      background-color: #4fd6c6;
      border-color: #4fd6c6;
      color: #11201e;
    }

    a { color: var(--teal); }
    a:hover { color: #4fd6c6; }
    .muted { color: var(--text-muted); }

    .site-footer {
      background-color: var(--bg-dark);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <header class="site-header text-center py-4">
    <h1 class="logo">EV ChargeFinders</h1>
    <p class="tagline">Find every charger you want</p>
  </header>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="login-card p-4 p-md-5 shadow">

      <h2 class="h3 text-center mb-1">Welcome back</h2>
      <p class="text-center muted mb-4">Log in to save your favorite stations</p>

      <form action="#" method="post">

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email"
                 placeholder="you@example.com" required>
        </div>

        <div class="mb-2">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password"
                 placeholder="Enter your password" minlength="8" required>
        </div>

        <div class="text-end mb-4">
          <a href="#" class="small">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-teal w-100">Log In</button>
      </form>

      <p class="text-center muted mt-4 mb-0">
        Don't have an account? <a href="#">Sign up</a>
      </p>

    </div>
  </main>

  <footer class="site-footer text-center py-3">
    &copy; 2026 EV Charge Finder. All rights reserved.
  </footer>

</body>
</html>
